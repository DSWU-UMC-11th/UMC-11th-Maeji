<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 첫 웹 페이지</title>
    
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    
  </head>
  <body>
    <main class="card">
      <header>
        <h1 id="page-title">김예지</h1>
        <p class="description">덕성여대 24학번 김예지입니다.</p>
      </header>

      <section>
        <h2 class="section-title">배우고 싶은 기술</h2>

        <ul class="skills">
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
      </section>

      <section>
        <h2 class="section-title">GitHub 사이트</h2>
        <a href="https://github.com/">GitHub 방문하기</a>
      </section>

      <section>
        <h2 class="section-title">버튼</h2>
        <button type="button">버튼 누르기</button>
      </section>
    </main>
    <script>
        const student = {
        name: "김예지",
        skills: ["HTML", "CSS", "JavaScript"],
        };

        function printSkills(skills) {
            for (const skill of skills) {
                if (skill === "JavaScript") {
                    console.log(`${skill}: 화면에 동작을 더합니다.`);
                } else {
                    console.log(skill);
                }
            }
        }

        console.log(student.name);
        printSkills(student.skills);
    </script>
  </body>
</html>
